upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 6M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
        # Prefer signed/private URLs in production S3 mode.
        # Local fallback remains authenticated via Django when USE_S3=True.
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
