# OPTIONS preflight has no JWT. The platform verify_jwt gate would 401 it
# before the function can return CORS headers, which is what blocked
# localhost:5173. POST still requires a user JWT via verifyAuth({ auth: "user" })
# plus the is_landlord RPC.
[functions.send-email]
verify_jwt = false

# The bootstrap action is guarded by ADMIN_BOOTSTRAP_SECRET (no JWT yet), and the
# onboard action verifies an admin JWT inside the handler via verifyAuth.
[functions.admin]
verify_jwt = false
