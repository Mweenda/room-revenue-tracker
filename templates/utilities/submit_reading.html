{% extends "base.html" %}
{% block title %}Submit Meter Reading{% endblock %}
{% block content %}
<div class="max-w-xl bg-white border p-6">
  <h1 class="text-2xl font-bold mb-4">Submit meter reading</h1>
  <form method="post" class="space-y-3">{% csrf_token %}{{ form.as_p }}
    <button class="min-h-[44px] px-4 bg-teal-700 text-white">Submit</button>
  </form>
</div>
{% endblock %}
