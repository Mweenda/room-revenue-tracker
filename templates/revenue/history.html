{% extends "base.html" %}
{% block title %}Payment History{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Payment history</h1>
<ul class="space-y-2">
{% for p in payments %}
<li class="bg-white border p-3 flex justify-between text-sm">
  <span>K{{ p.amount }} · {{ p.submitted_at|date:"Y-m-d" }}</span>
  <span class="uppercase">{{ p.status }}</span>
</li>
{% empty %}<li>No payments.</li>{% endfor %}
</ul>
{% endblock %}
